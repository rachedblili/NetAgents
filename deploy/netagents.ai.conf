# Drafted for review -- not applied to the live nginx config.
#
# Modeled on the existing strikerit.com.conf server block on this box.
# To use: copy to /etc/nginx/sites-available/netagents.ai.conf, symlink into
# sites-enabled/, run `certbot --nginx -d netagents.ai -d www.netagents.ai`
# (Certbot will rewrite the ssl_certificate lines below to point at the cert
# it issues), then `nginx -t && systemctl reload nginx`.
#
# Unlike strikerit.com, this site has a build step: nginx serves the
# Eleventy build OUTPUT (_site/), not the repo's source (src/). After
# editing content, `cd /home/rached/NetAgents && npm run build` regenerates
# _site/ -- there's no CI here, so that's a manual step for now.

server {
    listen 80;
    server_name netagents.ai www.netagents.ai;
    # Certbot will add a redirect to https here, or a separate 443 server
    # block below, once the cert exists.

    root /home/rached/NetAgents/_site;
    index index.html;

    access_log /var/log/nginx/netagents.access.log;
    error_log  /var/log/nginx/netagents.error.log;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
    error_page 404 /404.html;

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }
}

